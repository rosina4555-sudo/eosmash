<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="v-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="v-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141f38"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="v-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#0b1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="v-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#26344c"/>
    </pattern>
    <filter id="v-glow" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0b1020"/>
  <polygon points="0,0 1010,0 690,1000 0,1000" fill="url(#v-left)"/>
  <polygon points="1010,0 1600,0 1600,1000 690,1000" fill="url(#v-right)"/>
  <rect width="1600" height="1000" fill="url(#v-dots)" opacity="0.5"/>

  <g opacity="0.5">
    <polygon points="1010,0 1140,0 812,1000 690,1000" fill="#17243b"/>
    <polygon points="0,0 92,0 0,240" fill="#17243b" opacity="0.6"/>
    <polygon points="1600,760 1600,1000 1380,1000" fill="#17243b" opacity="0.6"/>
  </g>

  <g stroke="#c6f36a" fill="none" stroke-linejoin="round">
    <polyline points="1010,0 928,150 1002,268 892,430 968,566 858,700 796,860 690,1000"
      stroke-width="46" opacity="0.22" filter="url(#v-glow)"/>
    <polyline points="1010,0 928,150 1002,268 892,430 968,566 858,700 796,860 690,1000"
      stroke-width="6" opacity="0.95"/>
    <polyline points="1010,0 928,150 1002,268 892,430 968,566 858,700 796,860 690,1000"
      stroke-width="1.6" stroke="#e8edf4" opacity="0.7"/>
  </g>

  <g fill="#c6f36a">
    <polygon points="952,196 1044,176 1030,226" opacity="0.75"/>
    <polygon points="920,468 1014,448 1000,500" opacity="0.65"/>
    <polygon points="884,724 966,712 942,760" opacity="0.55"/>
  </g>
  <g fill="#97a5b9">
    <polygon points="836,176 760,198 790,232" opacity="0.5"/>
    <polygon points="804,516 726,544 762,572" opacity="0.45"/>
    <polygon points="726,772 660,806 700,828" opacity="0.4"/>
  </g>

  <g stroke="#97a5b9" stroke-width="2" opacity="0.4">
    <line x1="210" y1="330" x2="470" y2="330"/>
    <line x1="210" y1="366" x2="390" y2="366"/>
    <line x1="1180" y1="640" x2="1440" y2="640"/>
    <line x1="1250" y1="676" x2="1440" y2="676"/>
  </g>

  <rect width="1600" height="1000" fill="url(#v-vig)"/>
</svg>
