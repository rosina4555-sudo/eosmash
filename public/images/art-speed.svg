    <line x1="150" y1="452" x2="1460" y2="452" stroke="#c6f36a" stroke-width="26" opacity="0.28" filter="url(#s-glow)"/>
    <line x1="150" y1="452" x2="1460" y2="452" stroke="url(#s-fade-lime)" stroke-width="5"/>
    <line x1="240" y1="150" x2="1180" y2="150" stroke="url(#s-fade)" stroke-width="2.5"/>
    <line x1="520" y1="212" x2="1420" y2="212" stroke="url(#s-fade)" stroke-width="1.5"/>
    <line x1="120" y1="286" x2="980" y2="286" stroke="url(#s-fade)" stroke-width="3"/>
    <line x1="640" y1="346" x2="1500" y2="346" stroke="url(#s-fade-lime)" stroke-width="2"/>
    <line x1="320" y1="556" x2="1360" y2="556" stroke="url(#s-fade)" stroke-width="2"/>
    <line x1="760" y1="618" x2="1480" y2="618" stroke="url(#s-fade)" stroke-width="3"/>
    <line x1="180" y1="690" x2="1120" y2="690" stroke="url(#s-fade)" stroke-width="1.5"/>
    <line x1="560" y1="762" x2="1520" y2="762" stroke="url(#s-fade-lime)" stroke-width="2.5"/>
    <line x1="360" y1="846" x2="1300" y2="846" stroke="url(#s-fade)" stroke-width="2"/>
    <line x1="820" y1="916" x2="1440" y2="916" stroke="url(#s-fade)" stroke-width="1.5"/>
    <line x1="1180" y1="96" x2="1360" y2="96" stroke="#c6f36a" stroke-width="3" opacity="0.7"/>
    <line x1="1260" y1="500" x2="1470" y2="500" stroke="#c6f36a" stroke-width="3" opacity="0.6"/>
    <line x1="1090" y1="668" x2="1240" y2="668" stroke="#c6f36a" stroke-width="2.5" opacity="0.5"/>
    <line x1="1330" y1="780" x2="1520" y2="780" stroke="#97a5b9" stroke-width="2" opacity="0.5"/>
