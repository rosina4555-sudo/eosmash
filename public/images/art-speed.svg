<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="s-fade" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1520" y2="0">
      <stop offset="0" stop-color="#97a5b9" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#97a5b9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#97a5b9" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="s-fade-lime" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1520" y2="0">
      <stop offset="0" stop-color="#c6f36a" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#c6f36a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c6f36a" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="s-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#0b1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="s-glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#s-bg)"/>
  <polygon points="0,640 1600,380 1600,520 0,780" fill="#0e1630" opacity="0.7"/>
  <polygon points="0,120 1600,-140 1600,-40 0,220" fill="#0e1630" opacity="0.55"/>

